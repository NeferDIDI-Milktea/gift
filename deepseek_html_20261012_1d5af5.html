<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تذكرة الهدايا</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
    background: #eef0f4;
    background-image: radial-gradient(circle at 50% 0%, #ffffff 0%, #eef0f4 60%);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
    color: #14171f;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: min(370px, 100%);
    background: #ffffff;
    border-radius: 26px;
    padding: 26px 22px 22px;
    box-shadow:
      0 1px 2px rgba(16, 24, 40, .04),
      0 18px 48px -16px rgba(16, 24, 40, .22);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    color: #5b5bd6;
    background: #eef0ff;
    padding: 6px 12px;
    border-radius: 999px;
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -.02em;
    margin: 14px 0 6px;
  }

  .head p {
    font-size: 13.5px;
    color: #6b7280;
    line-height: 1.5;
  }

  /* ===== منطقة السحب ===== */
  .stage {
    position: relative;
    margin-top: 20px;
    height: 250px;
    border-radius: 20px;
    overflow: hidden;
    background: #f7f8fb;
    border: 1px solid #eceef4;
  }

  .prize {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 22px;
    text-align: center;
  }

  .p-icon { font-size: 40px; line-height: 1; }

  .p-title {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -.03em;
    color: #14171f;
  }

  .p-sub {
    font-size: 13px;
    color: #6b7280;
  }

  .p-code {
    margin-top: 10px;
    font-family: ui-monospace, 'SF Mono', monospace;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: .14em;
    color: #5b5bd6;
    background: #eef0ff;
    border: 1px dashed #c7c9f5;
    padding: 8px 16px;
    border-radius: 10px;
  }

  .pop { animation: pop .5s cubic-bezier(.34, 1.56, .64, 1) both; }
  @keyframes pop {
    from { opacity: 0; transform: scale(.82); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* ===== الغطاء القابل للسحب ===== */
  .cover {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: linear-gradient(160deg, #4f46e5 0%, #7c3aed 55%, #a855f7 100%);
    transition: transform .6s cubic-bezier(.22, 1, .36, 1);
    touch-action: none;
    cursor: grab;
    will-change: transform;
  }
  .cover::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(255,255,255,.22), transparent 65%);
    pointer-events: none;
  }

  .cover.dragging { cursor: grabbing; }
  .cover.dragging { transition: none; }

  .handle {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    color: #fff;
    user-select: none;
    pointer-events: none;
    position: relative;
    z-index: 1;
  }

  .handle .circle {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: rgba(255, 255, 255, .16);
    border: 1px solid rgba(255, 255, 255, .35);
    backdrop-filter: blur(6px);
    animation: float 1.8s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-7px); }
  }

  .handle .label {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .02em;
    opacity: .95;
  }

  .foot {
    margin-top: 16px;
    text-align: center;
    font-size: 12px;
    color: #9ca3af;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="head">
      <span class="badge">🎁 هدية</span>
      <h1>تذكرة الهدايا</h1>
      <p>اسحب التذكرة لأعلى لتعرف هديتك</p>
    </div>

    <div class="stage">
      <div class="prize" id="prize"></div>

      <div class="cover" id="cover">
        <div class="handle">
          <div class="circle">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19V5M5 12l7-7 7 7"/>
            </svg>
          </div>
          <div class="label">اسحب لأعلى</div>
        </div>
      </div>
    </div>

    <div class="foot" id="foot">هدية واحدة لكل مستخدم</div>
  </div>

<script>
  /* ====== الجوائز: خصومات + مشروب إضافي ====== */
  const PRIZES = [
    { kind: 'discount', amount: 10 },
    { kind: 'discount', amount: 15 },
    { kind: 'discount', amount: 20 },
    { kind: 'discount', amount: 25 },
    { kind: 'discount', amount: 30 },
    { kind: 'drink' }
  ];

  const KEY = 'gift_ticket_v1';

  const cover  = document.getElementById('cover');
  const prizeEl = document.getElementById('prize');
  const foot   = document.getElementById('foot');

  /* ====== حالة الاستخدام ====== */
  function getSaved() {
    try { return JSON.parse(localStorage.getItem(KEY)); }
    catch { return null; }
  }
  function save(p) {
    try { localStorage.setItem(KEY, JSON.stringify(p)); } catch {}
  }

  let used = getSaved();

  /* ====== بناء محتوى الجائزة ====== */
  function prizeHTML(p) {
    if (p.kind === 'drink') {
      return `
        <div class="p-icon">🥤</div>
        <div class="p-title">مشروب إضافي</div>
        <div class="p-sub">مشروب مجاني مع طلبك</div>
        <div class="p-code">FREE-DRINK</div>`;
    }
    return `
      <div class="p-icon">💸</div>
      <div class="p-title">خصم ${p.amount}%</div>
      <div class="p-sub">على إجمالي طلبك</div>
      <div class="p-code">SAVE${p.amount}</div>`;
  }

  /* ====== لو استخدم قبل كده ====== */
  if (used) {
    prizeEl.innerHTML = prizeHTML(used);
    cover.style.transition = 'none';
    cover.style.transform  = 'translateY(-100%)';
    cover.style.cursor     = 'default';
    cover.style.pointerEvents = 'none';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      cover.style.transition = '';
    }));
    foot.textContent = 'استخدمت هديتك بالفعل ✨';
  }

  /* ====== السحب ====== */
  let dragging = false;
  let startY   = 0;
  let currentY = 0;

  cover.addEventListener('pointerdown', e => {
    if (used) return;
    e.preventDefault();
    dragging = true;
    startY = e.clientY;
    cover.classList.add('dragging');
    cover.setPointerCapture(e.pointerId);
  });

  cover.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dy = Math.min(0, e.clientY - startY); // لفوق فقط
    currentY = dy;
    cover.style.transform = `translateY(${dy}px)`;
  });

  function endDrag() {
    if (!dragging) return;
    dragging = false;
    cover.classList.remove('dragging');

    if (currentY < -60) {
      reveal();
    } else {
      cover.style.transform = 'translateY(0)';
    }
    currentY = 0;
  }

  cover.addEventListener('pointerup', endDrag);
  cover.addEventListener('pointercancel', endDrag);

  /* ====== كشف الهدية ====== */
  function reveal() {
    if (used) return;

    const p = PRIZES[Math.floor(Math.random() * PRIZES.length)];
    used = p;
    save(p);

    prizeEl.innerHTML = prizeHTML(p);
    prizeEl.classList.add('pop');
    setTimeout(() => prizeEl.classList.remove('pop'), 500);

    cover.style.transform = 'translateY(-100%)';
    cover.style.cursor = 'default';
    foot.textContent = 'استخدمت هديتك بالفعل ✨';
  }
</script>
</body>
</html>
